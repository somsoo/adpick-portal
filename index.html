<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추천 리워드 포털</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
        .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="text-gray-800">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-indigo-600"><i class="fa-solid fa-gift mr-2"></i>리워드 종합 포털</h1>
            <p class="text-sm text-gray-500 hidden sm:block">매일 업데이트되는 최강 혜택 모음</p>
        </div>
    </header>
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="mb-8 overflow-x-auto whitespace-nowrap pb-2" id="category-container"></div>
        <div id="campaign-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-10 text-gray-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i><p>혜택을 불러오는 중입니다...</p>
            </div>
        </div>
    </main>
    <footer class="bg-gray-800 text-white mt-12 py-8 text-center">
        <p class="text-sm text-gray-400">&copy; 2026 리워드 포털. All rights reserved.</p>
        <p class="text-xs text-gray-500 mt-2">본 사이트는 제휴 마케팅 링크를 포함하고 있으며, 클릭 시 일정액의 수수료를 제공받을 수 있습니다.</p>
    </footer>
    <script>
        let allCampaigns = [];
        async function loadCampaigns() {
            try {
                // 캐시 방지를 위해 URL 뒤에 현재 시간(타임스탬프)을 붙입니다.
                const response = await fetch('campaigns.json?v=' + new Date().getTime());
                allCampaigns = await response.json();
                renderCategories();
                renderCampaigns('전체');
            } catch (error) {
                document.getElementById('campaign-grid').innerHTML = '<div class="col-span-full text-center py-10 text-red-400">데이터를 불러오는데 실패했습니다.</div>';
            }
        }
        function renderCategories() {
            const container = document.getElementById('category-container');
            const categories = ['전체', ...new Set(allCampaigns.map(c => c.category))];
            container.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}', this)" class="category-btn px-5 py-2 mr-2 rounded-full font-semibold text-sm transition-colors ${cat === '전체' ? 'bg-indigo-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'}">${cat}</button>
            `).join('');
        }
        function filterCategory(category, btnElement) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = 'category-btn px-5 py-2 mr-2 rounded-full font-semibold text-sm transition-colors bg-white text-gray-600 hover:bg-gray-100 border border-gray-200';
            });
            btnElement.className = 'category-btn px-5 py-2 mr-2 rounded-full font-semibold text-sm transition-colors bg-indigo-600 text-white';
            renderCampaigns(category);
        }
        function renderCampaigns(category) {
            const grid = document.getElementById('campaign-grid');
            const filtered = category === '전체' ? allCampaigns : allCampaigns.filter(c => c.category === category);
            if (filtered.length === 0) return grid.innerHTML = '<div class="col-span-full text-center">혜택이 없습니다.</div>';
            grid.innerHTML = filtered.map(c => `
                <div class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 card-hover flex flex-col h-full">
                    <div class="h-48 overflow-hidden bg-white border-b border-gray-100 p-2 flex items-center justify-center">
                        <img src="${c.image_url}" alt="${c.title}" class="max-h-full max-w-full object-contain rounded">
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <div class="flex flex-wrap gap-2 mb-2 self-start">
                            <span class="px-2 py-1 bg-indigo-50 text-indigo-600 text-xs font-bold rounded-md">${c.category}</span>
                            <span class="px-2 py-1 bg-green-50 text-green-600 text-xs font-bold rounded-md">${c.type}</span>
                            ${c.os !== 'Both' ? `<span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs font-bold rounded-md">${c.os}</span>` : ''}
                        </div>
                        <h3 class="font-bold text-lg mb-2 text-gray-800 line-clamp-2">${c.title}</h3>
                        <p class="text-sm text-gray-500 mb-4 line-clamp-3 flex-grow">${c.description}</p>
                        <a href="${c.click_url}" target="_blank" rel="noopener noreferrer" class="block w-full text-center bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition-colors">
                            👉 혜택 알아보기
                        </a>
                    </div>
                </div>
            `).join('');
        }
        loadCampaigns();
    </script>
</body>
</html>
